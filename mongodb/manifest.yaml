apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  ## These are repllicaset labels
  labels:
    project: roboshop
    component: mongodb
    tier: database
spec:
  replicas: 1
  selector:
  ## These are used to select the pods.
    matchLabels:
      project: roboshop
      component: mongodb
      tier: database
  ## Pod template
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: database
    spec:
      containers:
      - name: mongodb
        image: joindevops/mongodb:v1

